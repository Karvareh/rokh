name: issues

# Keeps one issue for every record that has one: opened while the record is
# open, with the record's title and its labels, closed when the record is. The
# record is the truth; its issue is where it is claimed and talked about. It
# runs when the records change on main, and when asked.

on:
  push:
    branches: [main]
    paths: ['missions/**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issues
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/records/go.mod
      - name: the labels first, so that every issue can carry them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tab=$(printf '\t')
          grep -v -e '^#' -e '^$' .github/labels.tsv |
          while IFS="$tab" read -r name color description; do
            gh label create "$name" --color "$color" --description "$description" --force
          done
      - name: one issue for every record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cd tools/records && go run . -root ../.. issues
