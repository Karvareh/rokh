name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rokh/go.mod
      - name: vet
        run: cd rokh && go vet ./...
      - name: test
        run: cd rokh && go test -timeout 45m ./...

  home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rokh-home/go.mod
      - name: vet
        run: cd rokh-home && go vet ./...
      - name: test
        run: cd rokh-home && go test -timeout 30m ./...
